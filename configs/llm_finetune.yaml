# ═══════════════════════════════════════════════════════════════════
# NysAdam Experiment Configuration: Transformer Language Model
# ═══════════════════════════════════════════════════════════════════
# Author: Hardik Tankaria | Date: May 2026
# Description: Language modeling on WikiText-2 with small transformer.
#   Primary experiment for demonstrating NysAdam's advantage on
#   attention architectures where d_eff is small (100-500).
# Usage: python -m nysadam.experiments.run_all --config configs/llm_finetune.yaml
# ═══════════════════════════════════════════════════════════════════

experiment_name: transformer_lm
seed: 42

dataset: wikitext2
batch_size: 32
seq_len: 256

model: transformer_lm
model_config:
  d_model: 256
  n_heads: 4
  n_layers: 4
  d_ff: 1024
  max_seq_len: 256
  dropout: 0.1

epochs: 30
eval_every: 1
log_every: 50
scheduler: cosine

optimizers:
  adamw:
    lr: 3.0e-4
    betas: [0.9, 0.999]
    weight_decay: 0.01

  sophia:
    lr: 1.0e-4
    betas: [0.965, 0.99]
    weight_decay: 0.01
    rho: 1.0
    hessian_refresh_interval: 10

  shampoo:
    lr: 3.0e-4
    betas: [0.9, 0.999]
    weight_decay: 0.01
    precondition_frequency: 100

  nysadam:
    lr: 3.0e-4
    betas: [0.9, 0.999]
    weight_decay: 0.01
    nys_rank: 64
    nys_refresh_interval: 10
    nys_beta: 0.999
    clip_threshold: 1.0
    nys_subsample: 16

  nysadam_light:
    lr: 3.0e-4
    betas: [0.9, 0.999]
    weight_decay: 0.01
    nys_rank: 32
