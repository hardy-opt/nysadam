# ═══════════════════════════════════════════════════════════════════
# NysAdam Experiment Configuration: Logistic Regression
# ═══════════════════════════════════════════════════════════════════
# Author: Hardik Tankaria | Date: May 2026
# Description: Classical convex optimization benchmark. Validates that
#   NysAdam correctly reduces to AdamW at m=0 and shows curvature
#   benefit on ill-conditioned logistic regression.
# Usage: python -m nysadam.experiments.run_all --config configs/logistic_regression.yaml
# ═══════════════════════════════════════════════════════════════════

experiment_name: logistic
seed: 42

# Data
dataset: digits          # sklearn digits (8×8 images, 10 classes)
test_size: 0.2

# Model
model: logistic

# Training
epochs: 50
batch_size: 128
eval_every: 1
log_every: 5
scheduler: cosine

# Optimizers to compare
optimizers:
  sgd:
    lr: 0.01
    momentum: 0.9
    weight_decay: 1.0e-4

  adamw:
    lr: 1.0e-3
    betas: [0.9, 0.999]
    weight_decay: 1.0e-4

  nysadam:
    lr: 1.0e-3
    betas: [0.9, 0.999]
    weight_decay: 1.0e-4
    nys_rank: 16
    nys_refresh_interval: 5
    nys_beta: 0.999
    clip_threshold: 1.0
    reg_lambda: 1.0e-4
    landmark_selection: topk_norm
    min_dim_for_nystrom: 32
    nys_subsample: 64

  nysadam_light:
    lr: 1.0e-3
    betas: [0.9, 0.999]
    weight_decay: 1.0e-4
    nys_rank: 16
    grad_buffer_size: 128
    nys_refresh_interval: 10
    min_dim_for_nystrom: 32

  sketchy_sgd:
    lr: 0.01
    nys_rank: 16
    mu: 1.0e-3
    weight_decay: 1.0e-4
    min_dim_for_nystrom: 32
